<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cờ Vua Bé Nhỏ</title>
  <meta name="description" content="Học cờ vua cho bé từ con số 0 – bài ngắn, vui, có Cú Mèo hướng dẫn.">
  <meta name="theme-color" content="#fff6e5">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button id="btn-home" class="icon-btn" aria-label="Về bản đồ">🗺️</button>
    <div id="top-title" class="top-title">Cờ Vua Bé Nhỏ</div>
    <div class="top-right">
      <span id="star-total" class="star-total" title="Tổng số sao">⭐ 0</span>
      <button id="btn-voice" class="icon-btn" aria-label="Bật/tắt giọng đọc">🔊</button>
    </div>
  </header>

  <main id="app"></main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modal-card"></div>
  </div>
  <div id="confetti" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
